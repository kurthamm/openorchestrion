[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openorchestrion"
version = "0.1.0-dev"
description = "Open-source networked MIDI music appliance with AI-powered music selection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kurt Hamm"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mido>=1.3",
  "python-rtmidi>=1.5",
  "pydantic>=2.8",
  "PyYAML>=6.0"
]

[project.scripts]
openorchestrion-fixtures = "openorchestrion.testing.midi_fixtures:main"
openorchestrion-analyze = "openorchestrion.midi.analyzer:main"
openorchestrion-import-midi = "openorchestrion.library.importer:main"
openorchestrion-reindex = "openorchestrion.library.catalog:reindex_main"
openorchestrion-catalog = "openorchestrion.library.catalog:query_main"
openorchestrion-station = "openorchestrion.stations:main"
openorchestrion-tag = "openorchestrion.library.tagging:main"
openorchestrion-reanalyze = "openorchestrion.library.repair:main"
openorchestrion-history = "openorchestrion.history:main"
openorchestrion-concierge = "openorchestrion.ai:main"
openorchestrion-serve = "openorchestrion.appliance:serve_main"
openorchestrion-kiosk = "openorchestrion.appliance:kiosk_main"
openorchestrion-smoke = "openorchestrion.appliance:smoke_main"
openorchestrion-deploy = "openorchestrion.appliance:deploy_main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openorchestrion = [
  "web/*.html",
  "web/*.css",
  "web/*.svg",
  "web/*.webmanifest",
  "web/js/*.js",
  "web/js/views/*.js",
  "deployment/*.service",
  "deployment/*.env",
  "deployment/*.desktop",
  "deployment/*.sh",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
