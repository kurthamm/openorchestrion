name: ShopGoodwill Live Scan

on:
  push:
    branches:
      - sgw-live-scan-20260825
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/sgw_live_scan.py'
      - '.github/workflows/sgw-live-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Sweep live ShopGoodwill inventory
        run: python scripts/sgw_live_scan.py
