name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.6.9"
  RUFF_RULES: "E4,E7,E9,F"
  JSONSCHEMA_VERSION: "4.23.0"
  BUILD_VERSION: "1.2.2.post1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and pinned Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "ruff==${RUFF_VERSION}"

      - name: Ruff
        run: python -m ruff check --select "${RUFF_RULES}" .

  test:
    name: test-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  repository-contracts:
    name: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and schema validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "jsonschema==${JSONSCHEMA_VERSION}" "build==${BUILD_VERSION}"

      - name: Validate schemas, profiles, and generated MIDI pipeline
        run: python .github/scripts/validate_repo.py

      - name: Build and smoke-test non-editable appliance wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m build --wheel
          python -m venv /tmp/openorchestrion-wheel
          /tmp/openorchestrion-wheel/bin/python -m pip install --upgrade pip
          /tmp/openorchestrion-wheel/bin/python -m pip install dist/*.whl

          runtime=$(mktemp -d)
          /tmp/openorchestrion-wheel/bin/openorchestrion-deploy --output-dir "$runtime/deploy"
          test -f "$runtime/deploy/openorchestrion.service"
          test -f "$runtime/deploy/openorchestrion-kiosk.desktop"
          test -x "$runtime/deploy/install-appliance.sh"

          mkdir -p "$runtime/state/library"
          export OPENORCHESTRION_LIBRARY_ROOT="$runtime/state/library"
          export OPENORCHESTRION_CATALOG_DB="$runtime/state/library/catalog.db"
          export OPENORCHESTRION_HISTORY_DB="$runtime/state/history.db"
          export OPENORCHESTRION_VIRTUAL_MIDI=0
          export OPENORCHESTRION_HOST=127.0.0.1
          export OPENORCHESTRION_PORT=8765

          (
            cd "$runtime"
            /tmp/openorchestrion-wheel/bin/openorchestrion-serve >server.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

            ready=0
            for _ in $(seq 1 40); do
              if /tmp/openorchestrion-wheel/bin/openorchestrion-smoke \
                  --url http://127.0.0.1:8765 --json >smoke.json 2>smoke.err; then
                ready=1
                break
              fi
              sleep 0.25
            done
            if [ "$ready" -ne 1 ]; then
              cat server.log >&2 || true
              cat smoke.err >&2 || true
              exit 1
            fi
            cat smoke.json
            kill "$server_pid"
            wait "$server_pid"
            trap - EXIT
          )
