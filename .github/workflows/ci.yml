name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.6.9"
  RUFF_RULES: "E4,E7,E9,F"
  JSONSCHEMA_VERSION: "4.23.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and pinned Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "ruff==${RUFF_VERSION}"

      - name: Ruff
        run: python -m ruff check --select "${RUFF_RULES}" .

  test:
    name: test-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  repository-contracts:
    name: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and schema validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "jsonschema==${JSONSCHEMA_VERSION}"

      - name: Validate schemas, profiles, and generated MIDI pipeline
        run: python .github/scripts/validate_repo.py
